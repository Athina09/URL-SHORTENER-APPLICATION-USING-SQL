<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URL Shortener</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: system-ui, sans-serif; max-width: 600px; margin: 2rem auto; padding: 0 1rem; }
        h1 { color: #333; }
        h2 { color: #555; font-size: 1.1rem; margin-top: 1.5rem; }
        ul { list-style: none; padding: 0; }
        li { padding: 0.5rem 0; border-bottom: 1px solid #eee; }
        li a { color: #0066cc; text-decoration: none; }
        li a:hover { text-decoration: underline; }
        input[type="url"] { width: 100%; padding: 0.5rem; margin: 0.5rem 0; border: 1px solid #ccc; border-radius: 4px; }
        input[type="submit"] { padding: 0.5rem 1rem; background: #0066cc; color: white; border: none; border-radius: 4px; cursor: pointer; }
        input[type="submit"]:hover { background: #0052a3; }
        .short-link { font-family: monospace; color: #0066cc; }
        p.empty { color: #888; }
    </style>
</head>
<body>
    <h1>Welcome to the URL Shortener</h1>
    <h2>Stored URLs</h2>
    <ul>
        {% for url in urls %}
        <li><a href="{% url 'redirect_to_original' url.short_url %}">{{ url.short_url }}</a> → {{ url.long_url }}</li>
        {% empty %}
        <p class="empty">No URLs stored yet.</p>
        {% endfor %}
    </ul>
    <h2>Shorten a New URL</h2>
    <form method="post" action="{% url 'shorten_url' %}">
        {% csrf_token %}
        <input type="url" name="long_url" placeholder="https://example.com/..." required>
        <input type="submit" value="Shorten">
    </form>
</body>
</html>
